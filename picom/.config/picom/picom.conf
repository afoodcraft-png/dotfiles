# --- Backend & Performa ---
# Menggunakan GLX (OpenGL) sebagai backend untuk performa yang lebih lancar
backend = "glx";
vsync = true;
use-damage = true;

# --- Rounded Corners ---
# Sudut membulat yang modern
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'"
];

# --- Fading (Efek Transisi) ---
# Efek memudar saat membuka/menutup jendela agar terlihat organik
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Shadows (Bayangan) ---
# Menambahkan shadow tipis agar tampilan desktop memiliki efek depth (kedalaman)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "_GTK_FRAME_EXTENTS@"
];
clip-shadow-above = true;

# --- Opacity & Blur ---
# Pengaturan transparansi untuk aplikasi tertentu
opacity-rule = [
  "90:class_g = 'Alacritty' && focused",
  "80:class_g = 'Alacritty' && !focused"
];

