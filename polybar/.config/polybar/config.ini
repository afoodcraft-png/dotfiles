;==========================================================
;  Polybar Config — Catppuccin Mocha + Nerd Fonts
;  Rice: Call of the Night / i3 / AlFaroji
;==========================================================

[colors]
base       = #1e1e2e
mantle     = #181825
crust      = #11111b
surface0   = #313244
surface1   = #45475a
overlay0   = #6c7086
text       = #cdd6f4
subtext    = #a6adc8
mauve      = #cba6f7
blue       = #89b4fa
sky        = #89dceb
teal       = #94e2d5
green      = #a6e3a1
yellow     = #f9e2af
peach      = #fab387
red        = #f38ba8
pink       = #f5c2e7
transparent = #00000000

;==========================================================
;  BAR
;==========================================================

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
radius = 0
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

; Slight padding top/bottom
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

; Font 0 = teks utama
; Font 1 = Nerd Fonts icons
; Font 2 = icons lebih besar
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=14;3
font-2 = JetBrainsMono Nerd Font:size=11;2

modules-left   = i3 xwindow
modules-center = date
modules-right  = modules-right  = disk pulseaudio cpu memory network bluetooth battery

separator = %{F#45475a}  %{F-}

line-size = 2
border-size = 0

; tray-position = none
wm-restack = i3
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize

;==========================================================
;  MODULES — KIRI
;==========================================================

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

; Workspace aktif
label-focused = %index%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.base}
label-focused-padding = 2
label-focused-font = 3

; Workspace ada window tapi tidak fokus
label-unfocused = %index%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 2

; Workspace visible (di monitor lain)
label-visible = %index%
label-visible-foreground = ${colors.subtext}
label-visible-padding = 2

; Workspace kosong
label-empty =
label-empty-padding = 0

[module/xwindow]
type = internal/xwindow
label = %{F#89b4fa}%{F-} %title:0:50:...%
label-foreground = ${colors.subtext}
label-empty = %{F#45475a}Desktop%{F-}

;==========================================================
;  MODULES — TENGAH
;==========================================================

[module/date]
type = internal/date
interval = 1

; Klik untuk toggle tanggal
date = %{F#cba6f7}󰃭 %{F-}%A, %d %B %Y
time = %{F#89b4fa}󰥔 %{F-}%I:%M %p

label = %time%  %date%
label-foreground = #cdd6f4

;==========================================================
;  MODULES — KANAN
;==========================================================

[module/disk]
type = internal/fs
interval = 30
mount-0 = /

format-mounted      = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = #a6e3a1
label-mounted       = %percentage_used%%
label-mounted-foreground = ${colors.text}

format-unmounted      = <label-unmounted>
label-unmounted       = %{F#f38ba8} N/A%{F-}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "
ramp-volume-foreground = #89b4fa

label-muted = %{F#6c7086}󰝟 muted%{F-}

click-right = pavucontrol &

[module/volume]
; fallback kalau pakai ALSA
type = internal/alsa
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.text}

ramp-volume-0 = %{F#89b4fa}%{F-}
ramp-volume-1 = %{F#89b4fa}%{F-}
ramp-volume-2 = %{F#89b4fa}%{F-}

label-muted = %{F#6c7086}󰝟 muted%{F-}

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = %{F#fab387} %{F-}
label = %percentage%%
label-foreground = ${colors.text}

; Kasih warning kalau CPU tinggi
format-warn-prefix = %{F#f38ba8} %{F-}
label-warn = %percentage%%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2

format-prefix = "󰍛 "
format-prefix-foreground = #cba6f7
label = %percentage_used%%
label-foreground = ${colors.text}

format-warn-prefix = %{F#f38ba8}󰍛 %{F-}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.red}

[module/network]
type = internal/network
interface-type = wireless
interval = 3

; --- Connected ---
format-connected = <label-connected>
label-connected = %{F#89dceb}󰖩 %{F-}%essid%
label-connected-foreground = ${colors.text}

; --- Disconnected (sembunyiin kalau kosong) ---
format-disconnected =
; kalau mau tetap tampil:
; label-disconnected = %{F#6c7086}󰖪 off%{F-}

; --- Paket TX/RX (opsional, uncomment kalau mau) ---
; label-connected = %{F#89dceb}󰖩 %{F-}%essid% %{F#45475a}↑%{F-}%upspeed:8% %{F#45475a}↓%{F-}%downspeed:8%

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = blueman-manager &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98
poll-interval = 5

; Icons per level
ramp-capacity-0 = %{F#f38ba8}󰁺%{F-}
ramp-capacity-1 = %{F#f38ba8}󰁻%{F-}
ramp-capacity-2 = %{F#f9e2af}󰁼%{F-}
ramp-capacity-3 = %{F#f9e2af}󰁽%{F-}
ramp-capacity-4 = %{F#f9e2af}󰁾%{F-}
ramp-capacity-5 = %{F#a6e3a1}󰁿%{F-}
ramp-capacity-6 = %{F#a6e3a1}󰂀%{F-}
ramp-capacity-7 = %{F#a6e3a1}󰂁%{F-}
ramp-capacity-8 = %{F#a6e3a1}󰂂%{F-}
ramp-capacity-9 = %{F#a6e3a1}󰁹%{F-}

format-charging    = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = %{F#a6e3a1}󰁹%{F-} <label-full>

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = Full

animation-charging-0 = %{F#f9e2af}󰢜%{F-}
animation-charging-1 = %{F#f9e2af}󰂆%{F-}
animation-charging-2 = %{F#f9e2af}󰂇%{F-}
animation-charging-3 = %{F#f9e2af}󰂈%{F-}
animation-charging-4 = %{F#a6e3a1}󰂉%{F-}
animation-charging-framerate = 750
